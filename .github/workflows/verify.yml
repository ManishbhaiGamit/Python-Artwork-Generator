name: Verify artwork
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run deterministic PNG checks
        run: |
          mkdir -p /output
          python main.py
          cp /output/entry.png /tmp/entry-first.png
          python main.py
          cmp /tmp/entry-first.png /output/entry.png
          python verify.py
